    <rect x="281" y="145" width="14" height="34" fill="#d8ded8"/>

    <!-- Screen is the face. The shell does not have animal eyes or a muzzle. -->
    <rect x="105" y="163" width="187" height="150" fill="#68736b"/>
    <rect x="111" y="169" width="175" height="138" fill="#101b17"/>
    <rect x="118" y="176" width="160" height="124" fill="#111f19"/>
