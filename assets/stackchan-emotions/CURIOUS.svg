<rect x="154" y="227" width="15" height="11" fill="#518d5a"/>
<rect x="152" y="218" width="6" height="7" fill="#e0ffd0"/>
<path d="M 232 209 H 248 V 213 H 252 V 233 H 248 V 238 H 232 V 234 H 228 V 214 H 232 Z" fill="#9fe887"/>
<rect x="234" y="223" width="15" height="11" fill="#518d5a"/>
<rect x="232" y="214" width="6" height="7" fill="#e0ffd0"/>
